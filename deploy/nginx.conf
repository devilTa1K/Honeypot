# Two listeners. 8080 = public decoy: its ONLY upstream is the decoy (no route to the control plane exists on it).
# 8090 = admin/SOC: published on loopback only by compose; private-source allowlist kept as defence in depth.
events {}
http {
  geo $admin_ok { default 0; 127.0.0.0/8 1; 10.0.0.0/8 1; 172.16.0.0/12 1; 192.168.0.0/16 1; }
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_read_timeout 300s;
  resolver 127.0.0.11 valid=10s ipv6=off;      # Docker DNS: used by per-environment listeners (variable proxy_pass)
  include /etc/nginx/envs/*.conf;              # per-environment decoy listeners rendered by scripts/provision.py
  include /etc/nginx/tls/*.conf;               # optional admin TLS listener (scripts/make_tls_cert.*)
  server {
    listen 8080;
    location / { proxy_pass http://decoy:8000; }
  }
  server {
    listen 8090;
    location / { if ($admin_ok = 0) { return 404; } proxy_pass http://control:8001; }
  }
}
# SSH decoy: TCP passthrough with PROXY protocol v1 so the decoy records the real client IP.
stream { server { listen 2222; proxy_pass decoy:2222; proxy_protocol on; } }
