# Privilege separation: decoy (public, insert-only DB role, no admin routes) / control (operator API, read role) / analyst (only service with internet).
# decoy, control, db_ingest, db_ctl are internal networks (no route out). Only proxy (edge) publishes ports; only analyst (egress) reaches the internet.
x-hardening: &hard
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
x-redis-url: &redis_url "redis://:${HIAB_REDIS_PASSWORD}@redis:6379/0"
services:
  db:
    <<: *hard
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hiab
      POSTGRES_DB: hiab
      POSTGRES_PASSWORD: "${HIAB_DB_PASSWORD:?set HIAB_DB_PASSWORD (see .env.example)}"
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U hiab -d hiab"], interval: 5s, retries: 12}
    networks: [db_ingest, db_ctl]
  redis:
    <<: *hard
    image: redis:7-alpine
    user: redis   # run directly as the redis user: the image entrypoint's root->redis switch needs capabilities we drop
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${HIAB_REDIS_PASSWORD:?set HIAB_REDIS_PASSWORD (see .env.example)}",
              "--rename-command", "CONFIG", "", "--rename-command", "DEBUG", "", "--rename-command", "FLUSHALL", "", "--rename-command", "FLUSHDB", "",
              "--rename-command", "REPLICAOF", "", "--rename-command", "SLAVEOF", "", "--rename-command", "MODULE", ""]
    environment: {REDISCLI_AUTH: "${HIAB_REDIS_PASSWORD}"}
    read_only: true
    healthcheck: {test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"], interval: 5s, retries: 12}
    networks: [db_ingest, db_ctl]
  migrate:
    <<: *hard
    build: .
    command: ["python", "-m", "app.migrate"]
    environment:
      DATABASE_URL: "postgresql+psycopg://hiab:${HIAB_DB_PASSWORD}@db:5432/hiab"
      HIAB_ANALYST_DB_PASSWORD: "${HIAB_ANALYST_DB_PASSWORD:?see .env.example}"
      HIAB_INGEST_DB_PASSWORD: "${HIAB_INGEST_DB_PASSWORD:?see .env.example}"
      HIAB_CONTROL_DB_PASSWORD: "${HIAB_CONTROL_DB_PASSWORD:?see .env.example}"
    read_only: true
    restart: "no"
    depends_on: {db: {condition: service_healthy}}
    networks: [db_ctl]
  decoy:
    <<: *hard
    build: .
    command: ["uvicorn", "app.decoy:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: "postgresql+psycopg://hiab_ingest:${HIAB_INGEST_DB_PASSWORD}@db:5432/hiab"
      HIAB_SKIP_MIGRATE: "1"
      REDIS_URL: *redis_url
      HIAB_SSH_PORT: "2222"
      HIAB_SSH_PROXY_PROTOCOL: "1"
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      retries: 6
    networks: [decoy, db_ingest]
  control:
    <<: *hard
    build: .
    command: ["uvicorn", "app.control:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      HIAB_ADMIN_TOKEN: "${HIAB_ADMIN_TOKEN:?set HIAB_ADMIN_TOKEN (see .env.example)}"
      DATABASE_URL: "postgresql+psycopg://hiab_control:${HIAB_CONTROL_DB_PASSWORD}@db:5432/hiab"
      HIAB_SKIP_MIGRATE: "1"
      REDIS_URL: *redis_url
      HIAB_GEOIP_DB: /geo/GeoLite2-City.mmdb
    read_only: true
    tmpfs: [/tmp]
    volumes: ["${HIAB_GEOIP_DIR:-./geoip}:/geo:ro"]
    mem_limit: 256m
    pids_limit: 100
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/healthz')"]
      interval: 10s
      retries: 6
    networks: [control, db_ctl]
  analyst:
    <<: *hard
    build: .
    command: ["python", "-m", "app.analyst_worker"]
    environment:
      DATABASE_URL: "postgresql+psycopg://hiab_analyst:${HIAB_ANALYST_DB_PASSWORD}@db:5432/hiab"
      HIAB_SKIP_MIGRATE: "1"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      HIAB_LLM_MODEL: "${HIAB_LLM_MODEL:-claude-sonnet-5-5}"
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    pids_limit: 50
    depends_on: {migrate: {condition: service_completed_successfully}}
    networks: [db_ctl, egress]
  proxy:
    <<: *hard
    image: nginx:1.27-alpine
    cap_add: [CHOWN, SETGID, SETUID]
    ports: ["127.0.0.1:8088:8080", "127.0.0.1:8090:8090", "127.0.0.1:2222:2222", "127.0.0.1:8100-8119:8100-8119", "127.0.0.1:8443:8443"]  # 8100-8119 per-environment decoys; 8088 decoy (change to 0.0.0.0:80 to expose), 8090 admin (keep on loopback)
    volumes: ["./deploy/nginx.conf:/etc/nginx/nginx.conf:ro", "./deploy/envs:/etc/nginx/envs:ro", "./deploy/tls:/etc/nginx/tls:ro"]
    depends_on: {decoy: {condition: service_healthy}, control: {condition: service_healthy}}
    networks: [decoy, control, edge]
networks:
  decoy: {internal: true}
  control: {internal: true}
  db_ingest: {internal: true}
  db_ctl: {internal: true}
  edge: {}
  egress: {}
volumes: {pgdata: {}}
